spring.application.name=public-health-api

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/public_health?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:43994399aawwddQ}

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Security - permit all requests (development only)
spring.security.filter.dispatcher-types=REQUEST,ASYNC,ERROR,FORWARD,INCLUDE

# JWT Configuration
jwt.secret=${JWT_SECRET:public-health-api-secret-key-change-in-production-environment}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000
jwt.issuer=${JWT_ISSUER:public-health-api}

# Spring AI Configuration - 智谱AI (ZhipuAI)
# 禁用 OpenAI 自动配置
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration

# 启用 ZhipuAI 聊天模型
spring.ai.model.chat=zhipuai

spring.ai.zhipuai.api-key=${AI_API_KEY:68a6ac690bdd44098bfdd3832d14e58f.gPeT7jsVurxBCg81}
spring.ai.zhipuai.base-url=https://open.bigmodel.cn/api/paas
spring.ai.zhipuai.chat.options.model=glm-4-flash
spring.ai.zhipuai.chat.options.temperature=0.7
spring.ai.zhipuai.chat.options.max-tokens=2000

# AI 模块自定义配置
ai.assistant.name=小卫
ai.entities=reportCard, user, object, audit
ai.session.max-history-messages=20
ai.session.session-expire-hours=72

# AI 重试配置
ai.retry.max-attempts=3
ai.retry.initial-interval=1000
ai.retry.multiplier=2.0
