spring.application.name=public-health-api

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/public_health?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=43994399aawwddQ

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Security - permit all requests (development only)
spring.security.filter.dispatcher-types=REQUEST,ASYNC,ERROR,FORWARD,INCLUDE

# JWT Configuration
